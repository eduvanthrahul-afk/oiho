name: Build
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile API
        run: mvn -B -f backend/pom.xml -DskipTests package
      - name: Validate Python syntax
        run: python -m py_compile simulation-engine/app/main.py
      - name: Validate frontend syntax
        run: node --check frontend/js/api.js && node --check frontend/js/app.js
